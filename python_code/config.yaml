snr: 40
cur_str: esp
num_snrs: 1
n_ants: 8
snr_step: 1
n_users: 4
mcs: 2
mod_pilot: -1
block_length_factor: 3
data_size: 200  # evaluate.py only: if > 0, use this directly as data_size (bits) instead of deriving it from pilot_size*(block_length_factor-1). Not read by ekf.py.
num_res: 96
cfo: 0
cfo_drift: 0  # ekf.py only: CFO drift rate in scs/sec. cfo (above) is the base/starting value; each group advances it by cfo_drift * (elapsed slots * SLOT_LENGTH_SEC), constant within a group of slots_per_group and stepping at group boundaries - same mechanism as channel_drift_base_index. Can be negative.
snr_drift: 0  # ekf.py only: SNR drift rate in dB/sec, same mechanism as cfo_drift. snr (above) is the base/starting value AND what load_pretrained_weights still matches against (unaffected by snr_drift) - each group's noise_var is instead derived from snr + snr_drift * (elapsed slots * SLOT_LENGTH_SEC). Can be negative.
clip_percentage_in_tx: 100
iqmm_gain: 0 # in dB
iqmm_phase: 0 # in degrees
epochs: 100
iterations: 1
pilot_size: 100  # evaluate.py: the regular pilot region size (bits). ekf.py: this is instead its whole run-length budget (bits) - must be set > 0 there, since every slot in that script is a pilot and there's no separate data_size fallback
batch_size: -1
shuffle: False
shuffle_augment_priors: False
shuffle_augment_seed: 15  # Seed for shuffle_augment_priors (-1 = random each run)
escnn_use_primary_val_only: True  # If True, ESCNN trains only on primary detector's validation portion
learning_rate: 5.0e-3
kernel_size: 3
stag_re_kernel_size: 3
full_e2e: True
ber_on_one_user: -1
sphere_radius: 200
save_loss_plot_snr: [-5, 0, 9, 19]
use_film: False
scale_input: True
escnn_dropout: 0.0
escnn_weight_decay: 0.0
override_noise_var: False
make_64QAM_16QAM_percentage: 0
increase_prime_modulation: False
sphere_64qam_mode: '1245'  # Which 4 bits the sphere decoder handles: '0235', '0134', or '1245'

use_data_as_pilots: False
plot_only_last_iteration: False
plot_channel: False
plot_genie: False

channel_model: 'C'
carrier_frequency: 2.6e9 # in Hz
speed: 10 # in m/s
channel_drift_base_index: 0  # TDL channel slot-offset (regular pass: fixed for the whole run; ekf.py: starting point, advances per group - see that file's docstring)
spatial_correlation: 'low'
# Environment channel settings (used when channel_model is UMa, UMi, or RMa)
env_o2i_model: 'low'          # outdoor-to-indoor model: 'low' or 'high' (UMa/UMi only)
env_bs_height: 25.0           # BS antenna height [m]
env_ut_height: 1.5            # UT height [m]
env_distance: 100.0           # BS-UT distance [m]
env_indoor: False             # UE indoor state
env_enable_pathloss: False    # apply pathloss (False for fair BER comparison)
env_enable_shadow_fading: False  # apply shadow fading
channel_seed: 1505

run_deeprx: False
run_deepsic: False
run_deepsicmb: False
run_deepstag: False
run_mhsa: False
run_sphere: False
run_tdcnn: False
run_tdfdcnn: False
run_jointllr: False
which_augment: 'AUGMENT_LMMSE'
override_augment_with_lmmse: False

mhsa_no_probs: True

deeprx_override: True

run_e2e: False
iters_e2e: 1
no_probs: False
no_samples: False  # ESCNN-only: feed only LLRs (no rx samples). Mutually exclusive with no_probs.
calc_mi: True
mi_estimator: 'histogram'  # 'histogram' (binned differential-entropy estimate, needs sample density to bin well) | 'gmi' (closed-form genie-aided GMI from true tx bits, no histogram/binning - see _mi_from_flat in evaluate.py)
mi_healthy_margin: 0.2  # mcs>-1 only: empirical margin above the LDPC code_rate that MI needs to clear for good BLER (e.g. MCS2 code_rate=0.30 -> target=0.50 at default). Printed live per-block ('[MI HEALTHY/LOW ...]') and saved as mi_target in the *_mi.csv
llr_nll_mode: 'none'  # 'none' (show BER on plot), 'consistent' (NLL with σ²=2μ), 'fitted' (NLL with free σ²), 'both'
training_loss: 'bce'  # 'bce', gfmi', 'tent', 'tsyn'
beta_balance: 0  # marginal-entropy balance weight: loss -= beta*H_b(q_bar). Used by gfmi/tent/tsyn. 0=disabled
tw: 0.5  # tsyn only: tent weight, L = tw*L_tent + (1-tw)*L_synd. tw=1 reproduces tent exactly
tsyn_fallback_iters: 1 # tsyn only: number of erasure-peeling rounds for punctured bits in fallback mode. 0 = restricted mode (no fallback), 1 = today's single-pass behavior, >1 = iterate
encode_pilots: True  # CRC+LDPC-encode the pilot region (slot-wise, same layout as data). REQUIRED for tsyn: without it the pilots carry no code structure and the syndrome term is disabled. Needs make_64QAM_16QAM_percentage: 0
save_llrs: False  # Save all LLRs per SNR point to HDF5 (float16 + gzip)
separate_pilots: True

# ESCNN train/test transfer (run 1 trains+saves under one config; run 2 loads+tests under another)
save_escnn_weights: False  # Save trained ESCNN weights to Scratchpad/<params>_<tag>.pt (no date/time, same params as the CSV filename)
escnn_weights_only: False  # When True (with save_escnn_weights), train+save then exit immediately - skips inference/BER/plots/CSV to save time
load_escnn_weights_tag: '896978'  # d62e80 (QPSK TDLC 1 UE 123 4K pilots) d36fd7 (QPSK Flat) 7aa9ab (QPSK TDLC 4 UEs 123) 505bd8 (QPSK TDLC 123 4 UEs NO_AUG) 08ae06 (QPSK TDLC 1 UE 123) 5e96b4 (QPSK TDLC 1 UE 123 NO_AUG) b91af9 (QPSK TDLC 123 with clipping) eee812 (16QAM TDLC 123)  '' = don't load  'auto' = look up ../Scratchpad/weights for a checkpoint matching this config's channel_model/channel_seed/which_augment/n_users/num_res (see resolve_auto_escnn_weights_tag in evaluate.py); errors out if none match
load_escnn_weights_snr_override: -1  # SNR is excluded from the tag, so by default the loader matches this run's own SNR. Set >= 0 to deliberately load a different-SNR-trained model (cross-SNR transfer test).
escnn_load_freeze: 'first_conv_and_scale_only'  # 'none', 'scale', 'last_conv', 'scale_only', 'last_conv_only', 'first_conv_only', 'first_conv_and_scale_only', 'all'

# ESCNN EKF tracking (ekf.py only): unsupervised, syndrome-driven test-time adaptation of
# whichever params escnn_load_freeze leaves unfrozen - requires load_escnn_weights_tag to be
# set. See ekf_syndrome.tex.
escnn_ekf_dynamics: 'ar1'  # State evolution f(theta): 'random_walk' (f=identity, F=I) | 'ar1' (f=alpha*theta+(1-alpha)*theta_pretrained, F=alpha*I; mean-reverts to the pretrained checkpoint, guards against drifting to a degenerate syndrome-satisfying solution)
escnn_ekf_alpha: 0.99  # ar1 only: per-slot reversion rate toward theta_pretrained (1.0 reproduces random_walk). Ignored if escnn_ekf_dynamics == 'random_walk'. Applied once per slot (~15/block at this config's pilot_size/block_length_factor) - move closer to 1.0 if that's too strong an anchor
escnn_ekf_sigma_p0: 0.1  # Initial state std: P_0|0 = sigma_p0^2 * I (confidence in theta_pretrained at the first slot)
escnn_ekf_sigma_q: 0.01  # Process noise std: Q = sigma_q^2 * I (how fast tracked params may drift per slot, applied once per slot - lower this if that adds up to too much per-block drift)
escnn_ekf_sigma_r: 0.5  # Measurement noise std: R = sigma_r^2 * I (trust in the soft-syndrome check values; larger = more conservative updates)
escnn_ekf_jacobian_chunk_size: 16  # jacrev batches this many syndrome-check rows through the backward pass at once; lower if update() runs out of (GPU) memory, raise for speed if it doesn't
debug_zero_llr_res: []  # ekf.py only, diagnostic: zero LMMSE's LLRs at these RE indices (e.g. [0] to test the suspected RE0/DC anomaly - see plot_channel_diag.py) before LDPC decode and before they're used as the AUGMENT_LMMSE prior for ESCNN. [] = no-op (default).
slots_per_group: 1  # Number of consecutive slots forming one Kalman "epoch": predict() runs once per this many slots (injecting sigma_q / the ar1 pull once, not once per slot), then each slot in the group is its own sequential update() without re-predicting in between. 1 = today's per-slot cadence (raise this if one slot's worth of syndrome data isn't enough to move the estimate meaningfully). In the per-slot streaming loop (channel_drift), this is also how many consecutive slots share one channel realization before channel_drift_base_index advances - same epoch, same knob, so the two can't drift out of sync.

# ekf.py only (streaming per-group channel-drift experiment; see that file's docstring)
# channel_drift_base_index (above) is reused here as the starting point; each group advances
# it by group_size_slots before transmitting, overwriting it for the rest of the run.
# ekf.py's run length also comes from data_size (above), NOT a separate parameter:
# it's truncated DOWN (not rounded up like evaluate.py's usage) to a whole number of groups of
# NUM_SYMB_PER_SLOT * slots_per_group symbols; leftover data that doesn't fill a
# complete group is discarded. data_size must be set > 0 for this script (no pilot_size fallback).
# At mcs=2 (qm=2) and slots_per_group=1, data_size=560 -> 20 groups.


# general
seed: 0 # run seed

# channel
cfo_and_iqmm_in_rx: True

early_stopping_patience: 10
log_train_every_epochs: 50
log_sphere_every_symbols: 5000


# validation phase protocol
block_length: -1 # 8004 2000 # coherence block time, total size of pilot + data. values: int.  - should be a multilpier of log2(mod_pilot)
blocks_num: 1 # 100 number of validation frames. values: int.
